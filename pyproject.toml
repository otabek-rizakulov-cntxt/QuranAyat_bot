# Tooling config only — the app is not a package (it runs as
# `uvicorn main:app --app-dir src`), so there is no [project] table.

[tool.ruff]
line-length = 100
target-version = "py310"
# `src/` is on the import path at runtime (see conftest.py), so its top-level
# packages — main, api, config, hifz, lib, locales, modules, services — sort as
# first-party.
src = ["src", "."]
extend-exclude = ["graphify-out", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # the formatter owns code width; long strings and comments are allowed
    "UP031",  # %-formatting is this codebase's consistent idiom, not a defect
    # Typing-syntax upgrades (Optional[X] -> X | None, List -> list, typing ->
    # collections.abc). Valid on 3.10 but pure churn across ~400 lines; adopt in
    # one dedicated pass later rather than mixed into real changes.
    "UP006", "UP007", "UP035", "UP045",
    "B008",   # FastAPI's Depends(...) in argument defaults is the framework's pattern
    "B904",   # raise-from inside except: worth doing, but per site, not as a sweep
    "B905",   # zip(strict=...) would turn silent truncation into a raise — a behaviour change
    "E741",   # `l` as a short-lived loop name; readability, not correctness
    "SIM105", # contextlib.suppress vs try/except/pass is a style preference
    "SIM108", # ternaries are not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before the app imports read the environment.
"src/main.py" = ["E402"]
# The test environment is pinned before the first app import (see its header).
"conftest.py" = ["E402"]
# The package's public API is a re-export of its submodules.
"src/locales/__init__.py" = ["F401"]
# Tests: opening fixture files inline and loop-unpacking for readability are fine.
"tests/**" = ["B007", "B017", "SIM115", "SIM117"]

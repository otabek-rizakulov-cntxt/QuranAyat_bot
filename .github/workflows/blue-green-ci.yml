# Blue-Green CI/CD for QuranAyat_bot
#
# Pipeline shape:
#   test ─► build ─► preflight ─► deploy-green ─► smoke-green ─► promote
#                                      └────────────── rollback (on any deploy failure)
#
#   • test        – pytest suite (Python matrix) against a throwaway Postgres service
#                   (so the asyncpg storage leg runs, not just the in-memory one) +
#                   locale integrity gate. Runs on every push/PR.
#   • build       – validates the Docker image builds. Runs on every push/PR.
#   • preflight   – (main only) decides whether deploy is enabled and which colour is the
#                   INACTIVE target. Deploy is skipped cleanly if KOYEB_API_TOKEN isn't set,
#                   so the pipeline stays green until you opt in.
#   • deploy-green– brings the inactive colour up and (re)deploys the new revision to it.
#   • smoke-green – independently curls the inactive colour's /health until it returns
#                   {"status":"ok"}. If it never does, the deploy failed → rollback.
#   • promote     – cuts production traffic to the freshly-verified colour and releases the
#                   old one. The previously-live colour is the automatic rollback target.
#   • rollback    – on any deploy/smoke/promote failure, releases the half-deployed colour
#                   and leaves the previously-live (blue) colour serving. Zero-downtime.
#
# ── One-time setup to enable the deploy half ────────────────────────────────────────────
#   Repository secret:
#     KOYEB_API_TOKEN     Koyeb API token (Koyeb console → Settings → API). Deploy is
#                         skipped entirely until this exists.
#   Repository variables (Settings → Secrets and variables → Actions → Variables):
#     KOYEB_APP           Koyeb app name              (default: quranayat-bot)
#     BLUE_SERVICE        blue service name           (default: bot-blue)
#     GREEN_SERVICE       green service name          (default: bot-green)
#     BLUE_HEALTH_URL     public https URL of blue    (e.g. https://bot-blue-<org>.koyeb.app)
#     GREEN_HEALTH_URL    public https URL of green   (e.g. https://bot-green-<org>.koyeb.app)
#     ACTIVE_COLOR        colour currently serving prod (default: blue) — flip after promote
#
#   NOTE: Koyeb's free tier is a single 512 MB instance, so blue and green cannot both run
#   at full scale simultaneously. This workflow therefore scales the target UP, verifies it,
#   then scales the old colour DOWN (a sequential blue-green swap). Running both colours hot
#   for a true instant cut-over needs a paid plan; the job structure is unchanged either way.
#
#   Koyeb CLI subcommand/flag names can vary by CLI version — if a deploy step errors,
#   confirm against `koyeb <group> --help` and adjust. The test/build gate is CLI-agnostic.

name: Blue-Green CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never cancel an in-flight run mid-promotion; queue instead.
concurrency:
  group: blue-green-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_DEFAULT: "3.12"

jobs:
  # ── CI gate ──────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    # Throwaway Postgres so tests/test_store_contract.py's SQL leg actually runs
    # instead of only skipping (see docs/HIFZ_PLATFORM.md §8). Truncated by the
    # fixture before every test — never point TEST_DATABASE_URL at real data.
    # POSTGRES_HOST_AUTH_METHOD=trust (no password): this container only ever
    # exists inside this job's own network namespace for the run's duration and
    # is destroyed after, so a password buys no real protection — and a
    # hardcoded one is exactly what secret scanners (rightly) flag on sight.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Locale integrity check
        run: python scripts/check_locales.py

      - name: Run test suite
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ── Image build validation ───────────────────────────────────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: quranayat-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Decide whether/where to deploy ───────────────────────────────────────────────────
  preflight:
    name: Preflight (deploy gate + target colour)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      deploy_enabled: ${{ steps.gate.outputs.enabled }}
      active: ${{ steps.colour.outputs.active }}
      target: ${{ steps.colour.outputs.target }}
    steps:
      - name: Check deploy is configured
        id: gate
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
        run: |
          if [ -n "$KOYEB_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ KOYEB_API_TOKEN present — deploy enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KOYEB_API_TOKEN not set — skipping deploy (CI gate still enforced)."
          fi

      - name: Resolve active / target colour
        id: colour
        run: |
          ACTIVE="${{ vars.ACTIVE_COLOR || 'blue' }}"
          if [ "$ACTIVE" = "green" ]; then TARGET="blue"; else TARGET="green"; fi
          echo "active=$ACTIVE"   >> "$GITHUB_OUTPUT"
          echo "target=$TARGET"   >> "$GITHUB_OUTPUT"
          echo "Live colour: $ACTIVE → deploying to inactive colour: $TARGET"

  # ── Deploy the new revision to the INACTIVE colour ("green") ─────────────────────────
  deploy-green:
    name: Deploy to ${{ needs.preflight.outputs.target }} (inactive)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.deploy_enabled == 'true'
    environment: green
    env:
      KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
      KOYEB_APP: ${{ vars.KOYEB_APP || 'quranayat-bot' }}
      TARGET: ${{ needs.preflight.outputs.target }}
      BLUE_SERVICE: ${{ vars.BLUE_SERVICE || 'bot-blue' }}
      GREEN_SERVICE: ${{ vars.GREEN_SERVICE || 'bot-green' }}
    steps:
      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      - name: Select target service
        run: |
          if [ "$TARGET" = "green" ]; then SVC="$GREEN_SERVICE"; else SVC="$BLUE_SERVICE"; fi
          echo "SVC=$SVC" >> "$GITHUB_ENV"
          echo "Target service: $KOYEB_APP/$SVC"

      - name: Bring target up and deploy new revision
        run: |
          # Scale the inactive colour up, then redeploy it to pull the latest revision.
          koyeb service update "$KOYEB_APP/$SVC" --min-scale 1 --max-scale 1 --token "$KOYEB_API_TOKEN"
          koyeb service redeploy "$KOYEB_APP/$SVC" --token "$KOYEB_API_TOKEN"

      - name: Wait for target to report HEALTHY
        run: |
          for i in $(seq 1 30); do
            STATUS="$(koyeb service get "$KOYEB_APP/$SVC" -o json --token "$KOYEB_API_TOKEN" \
                        | python -c 'import sys,json; print(json.load(sys.stdin).get("service",{}).get("status",""))' 2>/dev/null || true)"
            echo "[$i/30] status=$STATUS"
            [ "$STATUS" = "HEALTHY" ] && exit 0
            sleep 10
          done
          echo "::error::Target colour did not become HEALTHY in time."
          exit 1

  # ── Independently smoke-test the freshly-deployed colour ─────────────────────────────
  smoke-green:
    name: Smoke test ${{ needs.preflight.outputs.target }}
    runs-on: ubuntu-latest
    needs: [preflight, deploy-green]
    if: needs.preflight.outputs.deploy_enabled == 'true'
    env:
      TARGET: ${{ needs.preflight.outputs.target }}
      BLUE_HEALTH_URL: ${{ vars.BLUE_HEALTH_URL }}
      GREEN_HEALTH_URL: ${{ vars.GREEN_HEALTH_URL }}
    steps:
      - name: Health-check target /
        run: |
          if [ "$TARGET" = "green" ]; then URL="$GREEN_HEALTH_URL"; else URL="$BLUE_HEALTH_URL"; fi
          if [ -z "$URL" ]; then
            echo "::error::Health URL for '$TARGET' is empty — set BLUE_HEALTH_URL / GREEN_HEALTH_URL."
            exit 1
          fi
          echo "Probing $URL/"
          for i in $(seq 1 30); do
            BODY="$(curl -fsS --max-time 10 "$URL/" 2>/dev/null || true)"
            echo "[$i/30] $BODY"
            echo "$BODY" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' && { echo "✅ Green is serving OK."; exit 0; }
            sleep 10
          done
          echo "::error::Green never returned {\"status\":\"ok\"} — aborting promotion."
          exit 1

  # ── Promote: cut traffic to green, release blue ──────────────────────────────────────
  promote:
    name: Promote ${{ needs.preflight.outputs.target }} → production
    runs-on: ubuntu-latest
    needs: [preflight, deploy-green, smoke-green]
    if: needs.preflight.outputs.deploy_enabled == 'true'
    environment: production
    env:
      KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
      KOYEB_APP: ${{ vars.KOYEB_APP || 'quranayat-bot' }}
      ACTIVE: ${{ needs.preflight.outputs.active }}
      TARGET: ${{ needs.preflight.outputs.target }}
      BLUE_SERVICE: ${{ vars.BLUE_SERVICE || 'bot-blue' }}
      GREEN_SERVICE: ${{ vars.GREEN_SERVICE || 'bot-green' }}
      PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
    steps:
      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      - name: Switch traffic to target colour
        run: |
          if [ "$TARGET" = "green" ]; then NEW="$GREEN_SERVICE"; OLD="$BLUE_SERVICE";
          else NEW="$BLUE_SERVICE"; OLD="$GREEN_SERVICE"; fi
          echo "NEW=$NEW" >> "$GITHUB_ENV"; echo "OLD=$OLD" >> "$GITHUB_ENV"

          # Point the production domain at the verified colour (skipped if no custom domain set).
          if [ -n "$PRODUCTION_DOMAIN" ]; then
            echo "Attaching $PRODUCTION_DOMAIN → $KOYEB_APP/$NEW"
            koyeb domain attach "$PRODUCTION_DOMAIN" "$KOYEB_APP/$NEW" --token "$KOYEB_API_TOKEN"
          else
            echo "::notice::PRODUCTION_DOMAIN not set — traffic follows the scaled-up colour only."
          fi

      - name: Release old colour
        run: |
          # Free-tier: scale the previous colour to zero so a single instance suffices.
          koyeb service update "$KOYEB_APP/$OLD" --min-scale 0 --max-scale 0 --token "$KOYEB_API_TOKEN"
          echo "✅ Promoted $TARGET; released $ACTIVE."

      - name: Record new active colour
        run: |
          echo "::notice::Promotion complete. Set repository variable ACTIVE_COLOR=$TARGET so the next deploy targets $ACTIVE."

  # ── Rollback: keep the previously-live colour serving ────────────────────────────────
  rollback:
    name: Rollback (keep ${{ needs.preflight.outputs.active }})
    runs-on: ubuntu-latest
    needs: [preflight, deploy-green, smoke-green, promote]
    if: >-
      always() &&
      needs.preflight.outputs.deploy_enabled == 'true' &&
      (needs.deploy-green.result == 'failure' ||
       needs.smoke-green.result == 'failure' ||
       needs.promote.result == 'failure')
    env:
      KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
      KOYEB_APP: ${{ vars.KOYEB_APP || 'quranayat-bot' }}
      ACTIVE: ${{ needs.preflight.outputs.active }}
      TARGET: ${{ needs.preflight.outputs.target }}
      BLUE_SERVICE: ${{ vars.BLUE_SERVICE || 'bot-blue' }}
      GREEN_SERVICE: ${{ vars.GREEN_SERVICE || 'bot-green' }}
    steps:
      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      - name: Release failed colour, keep previous live
        run: |
          if [ "$TARGET" = "green" ]; then FAILED="$GREEN_SERVICE"; LIVE="$BLUE_SERVICE";
          else FAILED="$BLUE_SERVICE"; LIVE="$GREEN_SERVICE"; fi
          # Ensure the previously-live colour stays up, and scale the half-deployed one down.
          koyeb service update "$KOYEB_APP/$LIVE"   --min-scale 1 --max-scale 1 --token "$KOYEB_API_TOKEN" || true
          koyeb service update "$KOYEB_APP/$FAILED" --min-scale 0 --max-scale 0 --token "$KOYEB_API_TOKEN" || true
          echo "::warning::Deploy failed — rolled back to $ACTIVE. Production untouched."
